services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg14
    container_name: qadam-flow-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: qadam_flow_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./tools/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - qadam_flow_dev
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.0.7
    container_name: qadam-flow-redis-dev
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data_dev:/data
    networks:
      - qadam_flow_dev
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data_dev:
  redis_data_dev:

networks:
  qadam_flow_dev:
