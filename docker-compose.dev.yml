services:
  postgres:
    # PostgreSQL 18 (#611) keeps its data in /var/lib/postgresql/18/docker, so the volume is mounted one
    # level up, and it is a new one: the PostgreSQL 14 data in postgres_data_dev stays where it was, and a
    # branch from before #611 still finds it there.
    image: pgvector/pgvector:0.8.7-pg18
    container_name: qadam-flow-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: qadam_flow_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - pgdata_dev:/var/lib/postgresql
      - ./tools/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - qadam_flow_dev
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: valkey/valkey:8.1.10
    container_name: qadam-flow-redis-dev
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data_dev:/data
    networks:
      - qadam_flow_dev
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata_dev:
  redis_data_dev:

networks:
  qadam_flow_dev:
