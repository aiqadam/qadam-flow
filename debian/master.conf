# Qadam Flow API (master).
# Installed to /etc/qadam-flow/master.conf, read by systemd via
# EnvironmentFile=. This is systemd's format, not dotenv: no `export`,
# no inline comments, no ${VAR} expansion.

# --- process ---
AP_CONTAINER_TYPE=APP
AP_ENVIRONMENT=prod
AP_PORT=3000

# --- URLs ---
# Public URL of the web app, behind your reverse proxy.
AP_FRONTEND_URL=https://flow.example.com
# How the API reaches itself for internal calls. Direct, not via the proxy.
AP_INTERNAL_URL=http://127.0.0.1:3000

# --- logging ---
AP_LOG_LEVEL=info
AP_LOG_PRETTY=false

# --- database ---
AP_DB_TYPE=POSTGRES
AP_POSTGRES_HOST=127.0.0.1
AP_POSTGRES_PORT=5432
AP_POSTGRES_DATABASE=qadam_flow
AP_POSTGRES_USERNAME=qadam_flow
AP_POSTGRES_PASSWORD=CHANGE_ME
AP_POSTGRES_USE_SSL=false

# --- redis ---
# Change to 0 when this Redis instance is dedicated to Qadam Flow.
AP_REDIS_TYPE=STANDALONE
AP_REDIS_HOST=127.0.0.1
AP_REDIS_PORT=6379
AP_REDIS_DB=3

# --- secrets ---
# openssl rand -hex 16  (exactly 32 hex characters)
AP_ENCRYPTION_KEY=CHANGE_ME
# openssl rand -hex 32
AP_JWT_SECRET=CHANGE_ME

# --- execution ---
# Must match the worker's value. UNSANDBOXED runs Code steps with the
# worker's own privileges; use SANDBOX_CODE_ONLY for untrusted users.
AP_EXECUTION_MODE=UNSANDBOXED
# STRICT is the hardened option; it needs the egress proxy configured.
AP_NETWORK_MODE=UNRESTRICTED
AP_QADAM_VERSION_STORE_PATH=/var/lib/qadam-flow/qadam-versions
AP_FLOW_TIMEOUT_SECONDS=600
AP_WEBHOOK_TIMEOUT_SECONDS=30

# --- self-hosted defaults ---
AP_TELEMETRY_ENABLED=false
AP_CLOUD_AUTH_ENABLED=false
