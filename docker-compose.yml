services:
  app:
    image: ${QADAM_FLOW_IMAGE:-ghcr.io/aiqadam/qadam-flow:latest}
    container_name: qadam-flow-app
    restart: unless-stopped
    ports:
      - '${QADAM_FLOW_PORT:-8080}:80'
    depends_on:
      - postgres
      - redis
    env_file: .env
    environment:
      - AP_CONTAINER_TYPE=APP
    volumes:
      - ./cache:/usr/src/app/cache
      # The versioned qadam store (ADR-0003, #805): every qadam version the instance holds, under
      # qadams/<name>/<version>/, seeded from the image at start-up. The app writes it; workers mount
      # it read-only below. Unlike ./cache it is not disposable: keep it with the database when you
      # back up or move an install. Forked engines run official qadam versions from it (#779).
      # Mounted outside /usr/src/app on purpose: a stored version must not reach the app's own
      # node_modules by Node's upward lookup.
      - qadam_versions:/var/lib/qadam-flow/qadam-versions
    networks:
      - qadam-flow
  worker:
    image: ${QADAM_FLOW_IMAGE:-ghcr.io/aiqadam/qadam-flow:latest}
    restart: unless-stopped
    depends_on:
      - app
    env_file: .env
    environment:
      - AP_CONTAINER_TYPE=WORKER
      - AP_WORKER_API_URL=http://app:80
    deploy:
      replicas: 5
    # A stopping worker drains its running jobs for AP_WORKER_SHUTDOWN_GRACE_SECONDS (default 60),
    # then exits by itself at most 15s later; Docker's default of 10s would kill them mid-run (#585).
    # Keep this strictly above grace + 15s, and raise the two together.
    stop_grace_period: 90s
    # SANDBOX_PROCESS / SANDBOX_CODE_AND_PROCESS need CAP_SYS_ADMIN (and CAP_NET_ADMIN when
    # AP_NETWORK_MODE=STRICT) plus no seccomp/AppArmor confinement. This default grants none of it,
    # because UNSANDBOXED and SANDBOX_CODE_ONLY do not need it. To run an isolate mode, add
    # docker-compose.sandboxed.yml (#375):
    #   cp docker-compose.sandboxed.yml docker-compose.override.yml
    volumes:
      - ./cache:/usr/src/app/cache
      # Read-only: a worker's engines run flow code (a Code step in UNSANDBOXED runs as this user),
      # and the store's code runs for every tenant on every worker and outlives the image. Only the
      # app writes it (#779).
      - qadam_versions:/var/lib/qadam-flow/qadam-versions:ro
    networks:
      - qadam-flow
  postgres:
    # PostgreSQL 18 (#611). The 18 image keeps its data in /var/lib/postgresql/18/docker, so the volume
    # is mounted one level up, and it is a new volume: postgres_data holds the PostgreSQL 14 data of an
    # install that predates this change, which 18 cannot open. run.sh copies that data across with a dump
    # and restore. PostgreSQL 14 runs on postgres_data once more to be dumped, which leaves its data as it
    # was, and nothing writes to the volume after that, which is what keeps a rollback possible.
    #
    # postgres_data stays mounted, read-only, for the guard in `entrypoint` alone. Without it, an install
    # refreshed by hand would boot an empty PostgreSQL 18 database and look like a fresh install, its flows
    # still sitting in the old volume. When a restore finishes, run.sh writes the checksum of the old
    # cluster's pg_control into QADAM_FLOW_UPGRADED. The guard starts the server only if postgres_data
    # holds no cluster, or that checksum still matches: PostgreSQL 14 rewrites pg_control whenever it
    # runs, so a mismatch means the old volume was used after the upgrade (a rollback) and the 18 copy
    # is stale. An unreadable pg_control refuses too, rather than comparing an empty checksum.
    image: 'pgvector/pgvector:0.8.7-pg18'
    container_name: postgres
    restart: unless-stopped
    env_file: .env
    environment:
      - 'POSTGRES_DB=${AP_POSTGRES_DATABASE}'
      - 'POSTGRES_PASSWORD=${AP_POSTGRES_PASSWORD}'
      - 'POSTGRES_USER=${AP_POSTGRES_USERNAME}'
    entrypoint:
      - /bin/sh
      - -c
      - |
        legacy=/var/lib/postgresql-legacy
        if [ -s "$$legacy/PG_VERSION" ]; then
          if ! fingerprint=$$(cksum < "$$legacy/global/pg_control"); then
            echo "The postgres_data volume holds PostgreSQL $$(cat "$$legacy/PG_VERSION") data, but its global/pg_control cannot be read, so it is not known whether it was upgraded. Nothing was started or changed." >&2
            echo "Manual steps and rollback: https://flow.aiqadam.org/docs/install/guides/upgrade-postgres" >&2
            exit 1
          fi
          if [ "$$fingerprint" != "$$(cat /var/lib/postgresql/QADAM_FLOW_UPGRADED 2>/dev/null)" ]; then
            echo "The postgres_data volume holds PostgreSQL $$(cat "$$legacy/PG_VERSION") data that has not been upgraded to PostgreSQL 18, or that changed after the upgrade. Nothing was started or changed." >&2
            echo "Upgrade by re-running the installer for this install: curl -fsSL https://flow.aiqadam.org/run.sh | QADAM_FLOW_DIR=<install directory> sh" >&2
            echo "Manual steps and rollback: https://flow.aiqadam.org/docs/install/guides/upgrade-postgres" >&2
            exit 1
          fi
        fi
        exec docker-entrypoint.sh "$$@"
      - docker-entrypoint.sh
    command: ['postgres']
    volumes:
      - pgdata:/var/lib/postgresql
      - postgres_data:/var/lib/postgresql-legacy:ro
    networks:
      - qadam-flow
  redis:
    # Valkey, the BSD-licensed Redis fork (#612). It reads the RDB/AOF files redis:7.0.7 wrote into
    # redis_data, but writes RDB format 11, which redis:7.0.7 cannot load: going back to the old image
    # on this volume needs the volume emptied first. The 8.1 line has the 2025 Lua RCE fixes (8.1.4+).
    image: 'valkey/valkey:8.1.10'
    container_name: redis
    restart: unless-stopped
    volumes:
      - 'redis_data:/data'
    networks:
      - qadam-flow
volumes:
  pgdata:
  postgres_data:
  redis_data:
  # A named volume, not a bind mount like ./cache: the store must sit on a case-sensitive
  # filesystem, which a bind mount from macOS or Windows is not, and the store refuses to open there.
  qadam_versions:
networks:
  qadam-flow:
