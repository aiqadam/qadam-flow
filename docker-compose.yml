services:
  app:
    image: ${QADAM_FLOW_IMAGE:-ghcr.io/aiqadam/qadam-flow:latest}
    container_name: qadam-flow-app
    restart: unless-stopped
    ports:
      - '${QADAM_FLOW_PORT:-8080}:80'
    depends_on:
      - postgres
      - redis
    env_file: .env
    environment:
      - AP_CONTAINER_TYPE=APP
    volumes:
      - ./cache:/usr/src/app/cache
    networks:
      - qadam-flow
  worker:
    image: ${QADAM_FLOW_IMAGE:-ghcr.io/aiqadam/qadam-flow:latest}
    restart: unless-stopped
    depends_on:
      - app
    env_file: .env
    environment:
      - AP_CONTAINER_TYPE=WORKER
      - AP_WORKER_API_URL=http://app:80
    deploy:
      replicas: 5
    # A stopping worker drains its running jobs for AP_WORKER_SHUTDOWN_GRACE_SECONDS (default 60),
    # then exits by itself at most 15s later; Docker's default of 10s would kill them mid-run (#585).
    # Keep this strictly above grace + 15s, and raise the two together.
    stop_grace_period: 90s
    volumes:
      - ./cache:/usr/src/app/cache
    networks:
      - qadam-flow
  postgres:
    image: 'pgvector/pgvector:0.8.0-pg14'
    container_name: postgres
    restart: unless-stopped
    env_file: .env
    environment:
      - 'POSTGRES_DB=${AP_POSTGRES_DATABASE}'
      - 'POSTGRES_PASSWORD=${AP_POSTGRES_PASSWORD}'
      - 'POSTGRES_USER=${AP_POSTGRES_USERNAME}'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - qadam-flow
  redis:
    # Valkey, the BSD-licensed Redis fork (#612). It reads the RDB/AOF files redis:7.0.7 wrote into
    # redis_data, but writes RDB format 11, which redis:7.0.7 cannot load: going back to the old image
    # on this volume needs the volume emptied first. The 8.1 line has the 2025 Lua RCE fixes (8.1.4+).
    image: 'valkey/valkey:8.1.10'
    container_name: redis
    restart: unless-stopped
    volumes:
      - 'redis_data:/data'
    networks:
      - qadam-flow
volumes:
  postgres_data:
  redis_data:
networks:
  qadam-flow:
