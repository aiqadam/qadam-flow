name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # Same reusable workflow ci.yml calls, so the two cannot drift (#64). No gate
  # job here: nothing on a tag build is a required status check, and `build`
  # below depends on this job directly.
  verify:
    uses: ./.github/workflows/_verify.yml

  # A breaking change may not ship undocumented.
  #
  # WHY THIS JOB EXISTS. PR #210 removed the `WORKER_AND_APP` launch mode and
  # made `AP_CONTAINER_TYPE` required, which means every all-in-one
  # `docker run … qadam-flow:latest` install refuses to start after it ships —
  # and there is no automated migration from the embedded PGLite database to
  # PostgreSQL, so recovering is manual. It *was* written up in
  # docs/install/configuration/breaking-changes.mdx, but only because a person
  # noticed. Nothing in CI would have stopped the release otherwise.
  #
  # WHY HERE AND NOT IN ci.yml. `:latest` — the tag every installer and every
  # `docker pull` without a version resolves to — is published in exactly one
  # place: the `publish` job below, on a tag push. ci.yml's `image` job pushes
  # only `type=ref,event=branch` and `type=sha` (`:main`, `:sha-…`). So a merge
  # to `main` cannot reach a user, and the tag is the last point where a check
  # can still stop one from doing so.
  #
  # WHY IT IS NOT JUST A REVIEW HABIT. The person cutting a release is often not
  # the person who wrote the breaking commit, and is reading dozens of commits
  # at once. "Remember to update breaking-changes.mdx" is not a control.
  #
  # WHAT IT DOES NOT CATCH: a breaking change nobody marked as breaking. It
  # reads `type!:` subjects and `BREAKING CHANGE:` footers — declarations, not
  # behaviour. It also does not judge whether the changelog entry is any good.
  #
  # HOW TO PROCEED IF IT FAILS AND YOU ARE SURE IT IS WRONG: do not delete this
  # job. Re-cut the tag as an annotated tag whose message contains a
  # `Release-Gate-Override: <reason>` line. The gate then passes and records the
  # tagger and the reason in the log, the step summary and the tag object
  # itself. The full triage guide is in the script's header comment.
  #
  # The logic lives in tools/ci/check-breaking-change-changelog.sh so it can be
  # tested; tools/ci/test-breaking-change-gate.sh exercises it on cases it must
  # reject as well as cases it must accept, and runs in the `verify` job above.
  breaking-change-gate:
    name: Breaking changes are documented
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # fetch-depth: 0 is load-bearing. The default depth-1 checkout gives the
      # script a truncated range; it detects that and fails UNKNOWN rather than
      # reporting a clean release, so removing this line breaks the release
      # loudly instead of silently — which is the intent.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check the released range against the breaking-changes changelog
        run: tools/ci/check-breaking-change-changelog.sh "${{ github.ref_name }}"

  # The tag must agree with the version the image will report about itself.
  #
  # WHY THIS JOB EXISTS. `apVersionUtil.getCurrentRelease()` reads the root
  # package.json at runtime, and nothing bumps that file — both prior releases
  # did it in a hand-written `chore(release): vX.Y.Z` commit. So a tag cut
  # against a tree that still says the old version builds, publishes `:2.0.0`
  # *and* `:latest`, and cuts a GitHub Release, all green, while the running
  # image tells every operator it is the previous version and offers them an
  # upgrade to what they are already running (#326, #327). Like the gate above,
  # the previous control was somebody remembering.
  #
  # WHY IT IS ITS OWN JOB. A one-second string comparison should not wait behind
  # a two-platform Docker build, nor run twice inside that matrix.
  #
  # WHY IT IS NOT IN ci.yml. There is no tag on a pull request, so there is
  # nothing to compare against — same reasoning as the breaking-change gate.
  #
  # There is deliberately no override trailer: unlike "does this breaking change
  # need a changelog entry", a tag that disagrees with the version the binary
  # reports is never correct. tools/ci/test-version-tag-gate.sh exercises the
  # reject and UNKNOWN cases, and runs in the `verify` job above.
  version-tag-gate:
    name: Tag matches the declared version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check the tag against the root package.json version
        run: tools/ci/check-version-matches-tag.sh "${{ github.ref_name }}"

  # Informational, not a gate: tools/scripts/check-release-migrations.ts lists
  # which migrations are tagged `release` for this version and flags the
  # breaking ones, in the Actions log next to the gates above. #445 found it
  # unwired (no package.json script, no workflow step) despite its own header
  # framing it as a release-time tool. Not in `build`'s `needs`, and
  # `continue-on-error: true` at the job level: a listing has nothing to gate
  # on, so an install flake or an unexpected script failure here must not
  # redden an otherwise-good release the way a real gate's failure should.
  #
  # check-manifest-migrations.ts, the sibling script, is deliberately NOT wired
  # in here. It needs a manifest of migration names already applied on the
  # target (currently deployed) instance to compute a rollback plan against —
  # this pipeline has no way to obtain that; there is no live introspection of
  # a running deployment from a tag build. It stays a manual operator tool run
  # ahead of `node dist/src/rollback.js`, documented in its own header comment.
  release-migrations:
    name: Migrations tagged for this release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        id: node
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        id: bun
        with:
          bun-version: 1.3.3

      # Restore-only, same key `_verify.yml`'s `verify` job writes — see that
      # job's cache-restore step for what each key component is for. Without
      # this, every tag push pays a cold `bun install` (~230s, per that job's
      # own measurement) just to print a list.
      - name: Restore built node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/*/node_modules
            packages/*/*/*/node_modules
          key: node-modules-${{ vars.NODE_MODULES_CACHE_EPOCH || 'v1' }}-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-bun${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock', 'bunfig.toml', 'package.json', '.npmrc', 'tools/ci/install-deps.sh') }}

      - name: Install dependencies
        run: tools/ci/install-deps.sh

      - name: List migrations tagged for this release
        run: npm run check-release-migrations -- "${GITHUB_REF_NAME#v}"

  # Step 1a of the version-model decision in #433 (#475): publish the three framework
  # packages every qadam depends on through the bun workspace protocol —
  # `@aiqadam/shared`, `@aiqadam/qadams-framework`, `@aiqadam/qadams-common` — to npmjs
  # under the `@aiqadam` scope. #476 (step 1b, publishing the 238 qadams themselves) is
  # blocked on this landing first and is NOT wired here.
  #
  # WHY NOT bun's OWN `workspace:*` rewrite. `bun publish` / `bun pm pack` do rewrite a
  # `workspace:*` dependency to a real version, but they read that version from bun.lock's
  # per-workspace `version` field, not from the dependency's own package.json. That field
  # does not reliably refresh: on this repo, bumping `packages/shared/package.json` alone
  # (no dependency change) left `bun.lock` quoting the prior version through both a plain
  # `bun install` and `bun install --force` — only deleting and fully regenerating the
  # lockfile picked up the new version. A publish pipeline that trusted the native rewrite
  # would have silently packed a dependent against a `shared` version that was never
  # published (or, worse, one that later stops existing). tools/scripts/utils/publish-npm-
  # package.ts therefore uses the transform already written in
  # packages/cli/src/lib/utils/{workspace,prepare-qadam}-utils.ts, which reads each
  # workspace package's live source package.json directly and rewrites only the staged
  # `dist/package.json` copy that gets published — the source tree keeps `workspace:*`.
  #
  # WHY NOT GATING `build`/`publish` ON THIS. The Docker image and the npm packages are
  # independent artifacts for independent consumers (self-hosted operators vs. qadam SDK
  # authors); a flaky or rate-limited npm publish should not hold back the image tag users
  # actually install from. tools/scripts/publish-framework-packages.ts is idempotent per
  # package (packagePrePublishChecks skips anything already published at its current
  # version), so a re-run of this job after a transient failure is safe.
  publish-framework-packages:
    name: Publish framework packages to npm
    needs: [verify, breaking-change-gate, version-tag-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth: 0, same reasoning as breaking-change-gate above: packagePrePublishChecks
      # diffs against `origin/main` to tell "already published, nothing changed" apart from
      # "version not bumped after a real change", and a depth-1 checkout has no `origin/main`
      # to diff against.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        id: node
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        id: bun
        with:
          bun-version: 1.3.3

      # Restore-only, same key `_verify.yml`'s `verify` job writes — see release-migrations
      # above for what each key component is for.
      - name: Restore built node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/*/node_modules
            packages/*/*/*/node_modules
          key: node-modules-${{ vars.NODE_MODULES_CACHE_EPOCH || 'v1' }}-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-bun${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock', 'bunfig.toml', 'package.json', '.npmrc', 'tools/ci/install-deps.sh') }}

      - name: Install dependencies
        run: tools/ci/install-deps.sh

      - name: Build shared, qadams-framework, qadams-common
        run: npx turbo run build --filter=@aiqadam/shared --filter=@aiqadam/qadams-common --filter=@aiqadam/qadams-framework

      # NPM_TOKEN is an npmjs "Automation" token for the @aiqadam org, published-package
      # scope, stored as a repo (or org) secret of that exact name. .npmrc's
      # `//registry.npmjs.org/:_authToken=${NPM_TOKEN}` line already covers any scope that
      # falls through to the default registry, which `@aiqadam` does — no further .npmrc
      # change is needed for this job.
      - name: Publish shared, qadams-framework, qadams-common to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx ts-node --project tools/tsconfig.tools.json tools/scripts/publish-framework-packages.ts

  build:
    name: Build ${{ matrix.platform }}
    needs: [verify, breaking-change-gate, version-tag-gate]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            cacheScope: monolith-linux-amd64
            artifactSuffix: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            cacheScope: monolith-linux-arm64
            artifactSuffix: linux-arm64
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
          buildkitd-flags: --allow-insecure-entitlement network.host

      - name: Set up turbo remote cache (GHA-backed)
        uses: rharkor/caching-for-turbo@v2.3.12

      - name: Force TURBO_API to IPv4 loopback (moby/buildkit#5813)
        run: echo "TURBO_API=${TURBO_API//localhost/127.0.0.1}" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/aiqadam/qadam-flow
          labels: |
            org.opencontainers.image.title=Qadam Flow
            org.opencontainers.image.description=Open-source AI-first workflow automation platform
            org.opencontainers.image.source=https://github.com/aiqadam/qadam-flow

      # Baked into the image as AP_COMMIT_SHA / AP_BUILD_TIMESTAMP (see Dockerfile's `run`
      # stage) and surfaced to the frontend via the flags API for #378's build-info UI. Must
      # stay in lockstep with ci.yml's identically named step — that one only ever publishes
      # `:main` / `:sha-xxxxxxx`, this one is what every `:latest` / `:vX.Y.Z` end users
      # actually pull ships with. The commit's own commit-date, not `date -u`: see ci.yml's
      # comment on the same step for why (this is a two-runner matrix too).
      - name: Compute build metadata
        id: build_meta
        run: echo "timestamp=$(git show -s --format=%cI ${{ github.sha }})" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.cacheScope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cacheScope }}
          allow: |
            network.host
          build-args: |
            TURBO_API=${{ env.TURBO_API }}
            TURBO_TOKEN=${{ env.TURBO_TOKEN }}
            TURBO_TEAM=${{ env.TURBO_TEAM }}
            COMMIT_SHA=${{ github.sha }}
            BUILD_TIMESTAMP=${{ steps.build_meta.outputs.timestamp }}
          outputs: type=image,name=ghcr.io/aiqadam/qadam-flow,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.artifactSuffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Push manifest & GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/aiqadam/qadam-flow
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Create multi-arch manifest and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/aiqadam/qadam-flow@sha256:%s ' *)

      - name: Inspect manifest
        run: |
          docker buildx imagetools inspect \
            ghcr.io/aiqadam/qadam-flow:${{ steps.meta.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Docker image: `ghcr.io/aiqadam/qadam-flow:${{ steps.meta.outputs.version }}`

            Supported platforms: `linux/amd64`, `linux/arm64`.

            ## Install

            ```bash
            docker pull ghcr.io/aiqadam/qadam-flow:${{ steps.meta.outputs.version }}
            ```
