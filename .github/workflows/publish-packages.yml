name: Publish packages

# Publishing the framework packages WITHOUT cutting a release (#496).
#
# WHY THIS FILE EXISTS. release.yml runs on `on: push: tags: ['v*']`, and in this repo that
# tag is the engine release: `build` -> `publish` pushes the Docker manifest, moves `:latest`
# (the tag every `run.sh` install resolves to) and cuts a GitHub Release. Hanging the npm
# publish off the same event — which is what #475 originally specified — made the two
# inseparable, so `@aiqadam/shared` could not reach the registry without shipping a product
# release nobody asked for. `version-tag-gate` sharpens it: it pins the tag to the root
# package.json version, currently `2.0.0`, while the three packages version independently
# (`shared` 0.135.0, `qadams-framework` 0.32.1, `qadams-common` 0.14.1) — so publishing a
# 0.135.0 library would have meant declaring a 2.0.0 product release. release.yml's own
# header already called the image and the packages "independent artifacts for independent
# consumers"; that had been applied to the failure direction only, never to the trigger.
#
# WHAT THIS IS NOT. Not a second copy of the pipeline: both entry points call the same
# _pack-framework-packages.yml, for the same reason _verify.yml exists (#64). The publishing
# job is NOT shared — see its own comment below for why that is a requirement rather than an
# oversight. Not a way around the human gate either: it sits behind the `npm-publish`
# environment and its required reviewers, same as on the tag path.
#
# WHY NO breaking-change-gate AND NO version-tag-gate, the two release.yml gates missing
# here. Both are statements about a tag. version-tag-gate compares `github.ref_name` to the
# root package.json version, and there is no tag on a dispatch. breaking-change-gate reads
# commit subjects since the previous tag and demands an entry in
# docs/install/configuration/breaking-changes.mdx, which is about the ENGINE release a tag
# performs — it says nothing about whether `@aiqadam/shared` changed compatibly, and running
# it here would fail dispatches for breaking changes to a Docker image this run does not
# touch. What is left is `default-branch-gate` below, `verify`, the `origin/main` ancestry
# check inside the called packing workflow, and the `npm-publish` environment reviewers on the
# publishing job below — which is in THIS file, not the called one, for the reason that job's
# own comment gives.
#
# `verify` here is a strict subset of what a PR gets: two of its steps (the new-migration
# metadata check and check-required-prop-defaults) carry `if: github.event_name ==
# 'pull_request'` and are skipped. Neither is a publish-path control, and the tag path has
# always had the same property — but do not read "verify ran" as "the PR suite ran".
#
# A BREAKING CHANGE TO THE PACKAGES is therefore on the person dispatching, as it is on the
# person tagging. The check that would make it automatic does not exist yet; #475's third
# deliverable (the version-bump policy now that these numbers are public) is where it belongs.
#
# WHAT THIS WORKFLOW CANNOT ENFORCE, and what has to be configured on the environment itself.
# Both reviews of #496 landed on the same point from opposite directions, so it is recorded
# here rather than in a PR thread: the gate below, and the ancestry check in the called
# workflow, both ship FROM the ref being dispatched. Anyone who can push a branch can push one
# with either check deleted and dispatch that — the same privilege that could always push a
# `v*` tag at an arbitrary commit, so this is not a new class of exposure, but it does mean no
# in-repo check is the real control. The real control is a DEPLOYMENT BRANCH POLICY on the
# `npm-publish` environment (Settings -> Environments -> npm-publish -> "Selected branches and
# tags" -> the default branch, plus `v*` for the tag path). That is enforced outside the ref,
# so a modified workflow on a branch cannot reach the credential at all — the job is blocked
# before a reviewer is even asked. Everything below is defence in depth underneath it.
on:
  workflow_dispatch:

# The whole run is the unit, not a single job. A `v*` tag is rare, visible and expensive to
# create, so release.yml queues nothing; a dispatch is none of those — anyone who can fire it
# can fire it in a loop, and every run that clears the gates parks on the `npm-publish`
# approval and pages the reviewers. Approval fatigue is the precondition for every other
# attack on this pipeline. At workflow level rather than per job so a second run cannot slip
# its packing job between this one's packing and publishing; `cancel-in-progress: false`
# because a run that is mid-publish must never be killed.
concurrency:
  group: publish-packages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # WHY THIS EXISTS AND THE ANCESTRY CHECK IS NOT ENOUGH. `git merge-base --is-ancestor HEAD
  # origin/main` establishes "this commit was merged into main", not "this IS main". Every old
  # commit on main passes it — including one that was merged, found bad, and reverted, since a
  # revert adds a commit rather than removing the original from history. On the tag path that
  # gap was covered incidentally: reaching an old commit meant creating a `v*` tag on it, and
  # version-tag-gate then demands the tag equal the root package.json version. There is no tag
  # here, so nothing pins the ref to anything current.
  #
  # What that buys an honest mistake is worse than it sounds, because the skip is computed
  # against a dist-tag rather than the version list: packagePrePublishChecks asks npm for
  # `<pkg>/latest`, so dispatching from a ref where shared says 0.130.0 while npm's `latest`
  # is 0.135.0 reads as "not published", packs, and publishes 0.130.0 to `latest` — moving it
  # BACKWARDS. Once #476 lands every qadam install resolves through `latest`. A 403 (the
  # version really does exist) is the lucky outcome; a version that predates this pipeline and
  # was never published is the unlucky one.
  #
  # A job rather than an `if:` on the call, so a dispatch from the wrong ref fails loudly
  # instead of reporting a green run in which nothing happened. It gates `verify` too, so a
  # wrong ref costs seconds rather than a full lint-and-test cycle — while the queue is empty.
  # The workflow-level `concurrency` above means a run dispatched behind one parked on the
  # approval gate pends as a whole and may never report this gate at all.
  default-branch-gate:
    name: Dispatched from the default branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse a dispatch from any ref but the default branch
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "${DEFAULT_BRANCH:-}" ]; then
            echo '::error::the event payload carried no repository.default_branch, so this gate cannot establish what it is meant to establish. Refusing to publish rather than passing vacuously.'
            exit 1
          fi
          if [ "${REF_TYPE:-}" != "branch" ] || [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "::error::this workflow publishes the tip of ${DEFAULT_BRANCH}; it was dispatched from ${REF_TYPE:-?} '${REF_NAME}'. Publishing an older or unmerged tree can move the npm 'latest' dist-tag backwards. Re-dispatch from ${DEFAULT_BRANCH}, or cut a v* tag if this is a release."
            exit 1
          fi
          echo "Dispatched from ${DEFAULT_BRANCH}; proceeding."

  # Not gated on a path filter and not skippable: the tarball is built from this tree, and it
  # is cheap next to an unretractable publish. ci.yml has already run it on the merge commit,
  # but that run is not this run and its result is not consulted here.
  verify:
    needs: [default-branch-gate]
    uses: ./.github/workflows/_verify.yml

  pack-framework-packages:
    needs: [default-branch-gate, verify]
    # No credential reaches this half, and no `secrets:` are passed to it. It installs and
    # builds the third-party dependency graph; that is why the publishing job below is a
    # separate job with a separate permission set (#486).
    permissions:
      contents: read
    uses: ./.github/workflows/_pack-framework-packages.yml

  # Copied from release.yml rather than shared, and that is the point (#498): `environment:`
  # only resolves its secrets in a job that lives in the workflow the event triggered. Inside
  # a reusable workflow the environment still gates on its reviewers but `secrets.NPM_TOKEN`
  # comes back empty — measured twice, see _pack-framework-packages.yml's header. Passing the
  # token down instead would force it to repository scope, where every workflow in the repo
  # can read it, so the five steps below are duplicated on purpose. Everything with real logic
  # in it is shared: the packing workflow above and tools/ci/publish-packed-tarballs.sh.
  publish-framework-packages:
    name: Publish framework packages to npm
    needs: [pack-framework-packages]
    runs-on: ubuntu-latest
    # Sized for the manifest, not for three packages: since #476 it can carry the 238-qadam
    # catalogue as well, and publish-packed-tarballs.sh walks it SERIALLY with --provenance, so
    # each entry costs a registry round trip plus a Sigstore signing exchange. Keep this and the
    # copy in the other caller identical — tools/ci/test-publish-packed-tarballs.sh compares the
    # two jobs line for line with comments stripped, and a timeout that differs is drift.
    timeout-minutes: 90
    # Requires a GitHub Environment named `npm-publish` (Settings → Environments) with
    # required reviewers configured and `NPM_TOKEN` stored as an ENVIRONMENT secret on it.
    #
    # Whatever this workflow gates on constrains the tree's QUALITY, not its PROVENANCE. On
    # the tag path none of verify/breaking-change-gate/version-tag-gate assert the tagged
    # commit was ever reviewed, breaking-change-gate is deliberately tagger-overridable by
    # design (see its own header), and `on: push: tags` runs whatever release.yml says at the
    # tagged commit regardless of who pushed the tag. Anyone with `contents: write` — a
    # collaborator, a leaked PAT, a compromised Action — could otherwise push a tag at a
    # commit that never touched `main` and publish `@aiqadam/shared`, the transitive root of
    # every qadam, to public npm at `latest` with no human in the loop. The dispatch path
    # replaces "can push a tag" with "can start a workflow_dispatch run", the same set of
    # credentials, and clears two of the three gates, which makes the human load-bearing
    # rather than a formality.
    #
    # A required-reviewers environment is the one control in Actions that interposes a human
    # between "a run started" and "the publish secret is readable". The ancestry check in the
    # packing workflow is a second, automatic layer underneath it, not a replacement.
    environment: npm-publish
    permissions:
      contents: read
      # For --provenance: npm exchanges this job's OIDC token for a signed attestation tying
      # the published tarball to this workflow run and commit. libnpmpublish builds that
      # attestation from the Actions environment (GITHUB_REPOSITORY / GITHUB_SHA /
      # GITHUB_REF / GITHUB_WORKFLOW_REF) and the tarball's own digest, never from a working
      # tree — which is why it still works with nothing installed here.
      id-token: write
    steps:
      # Shallow and credential-less, for one file: tools/ci/publish-packed-tarballs.sh. No
      # install runs here and nothing is built, so there is no node_modules for an `npx` to
      # resolve a shimmed `npm` out of. `persist-credentials: false` because a job holding an
      # npm publish token has no business also holding a git one.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # `registry-url` + `scope` write an npmrc to $RUNNER_TEMP and export NPM_CONFIG_USERCONFIG
      # for the rest of the job, which npm honours from any cwd. That generated npmrc's auth
      # line is `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`, so the secret has to be
      # exported under exactly that name below — NPM_TOKEN is what the secret is called in
      # Settings → Environments → npm-publish; NODE_AUTH_TOKEN is what npm's own generated
      # config reads.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          scope: '@aiqadam'

      # Into RUNNER_TEMP, deliberately OUTSIDE the checkout: npm resolves its project config
      # from the nearest ancestor holding a package.json or a node_modules, and project config
      # outranks the userconfig setup-node just wrote. Downloading these into the workspace
      # would put the repo-root .npmrc — whose auth line names NPM_TOKEN, not NODE_AUTH_TOKEN —
      # in front of the one that carries the credential. The script asserts this rather than
      # trusting it.
      - uses: actions/download-artifact@v4
        with:
          name: npm-framework-packages
          path: ${{ runner.temp }}/npm-packages

      # `secrets.NPM_TOKEN` interpolates to the empty string rather than failing when it is
      # not readable, and the first thing that would notice is npm answering 401 — after a
      # human has already approved the deployment, in the job whose failures are most
      # expensive to read out of a log.
      #
      # This step has already earned its keep once, and the message it prints is the second
      # version: the first confidently told the reader to make NPM_TOKEN an environment
      # secret, which is exactly what it already was. The real cause was that the publishing
      # job lived in a reusable workflow, where environment secrets do not resolve at all
      # (#498, and see _pack-framework-packages.yml's header for the measurement). Keep the
      # message describing what to CHECK rather than asserting a cause.
      - name: Check the publish credential is readable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo '::error::NPM_TOKEN resolved to an empty string, so nothing was published. Check, in order: that the npm-publish environment holds a secret named exactly NPM_TOKEN (Settings -> Environments -> npm-publish -> Secrets); that this job still declares `environment: npm-publish`; and that this job has not been moved into a reusable workflow, where environment secrets do not resolve.'
            exit 1
          fi

      - name: Publish the packed tarballs to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: tools/ci/publish-packed-tarballs.sh "${{ runner.temp }}/npm-packages"
