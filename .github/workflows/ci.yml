name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Deny-by-default path classifier. Emits docs_only=true ONLY when every path in
  # the PR diff is provably prose or a prose asset; anything unrecognised,
  # unreadable, or outside a pull_request event falls through to docs_only=false,
  # i.e. the full pipeline. A wrong answer here must never be "skip the tests",
  # so every failure mode below deliberately reports false.
  # The classification rules are in tools/ci/classify-path.sh; see the comments
  # there before widening anything.
  changes:
    name: Classify changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail

          emit() {
            echo "docs_only=$1" >> "$GITHUB_OUTPUT"
            echo "::notice::docs_only=$1"
            exit 0
          }

          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Event '$EVENT_NAME' is not a pull_request; running the full pipeline."
            emit false
          fi

          if [ -z "${BASE_SHA:-}" ] || [ -z "${HEAD_SHA:-}" ]; then
            echo "::warning::Missing base/head SHA; running the full pipeline."
            emit false
          fi

          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null \
            || ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            echo "::warning::base/head commit not present locally; running the full pipeline."
            emit false
          fi

          if ! merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA" 2>/dev/null)"; then
            echo "::warning::Could not compute merge-base; running the full pipeline."
            emit false
          fi

          # --no-renames expands a rename into delete+add so BOTH the old and the
          # new path get classified; a code -> docs rename must not read as docs.
          # Written to a file, not a variable: bash strips NUL bytes out of
          # command substitutions, so `-z` output collapses into one unterminated
          # record and a NUL-delimited read loop silently classifies nothing.
          changed="${RUNNER_TEMP}/changed-paths.txt"
          if ! git diff --name-only --no-renames "$merge_base" "$HEAD_SHA" > "$changed" 2>/dev/null; then
            echo "::warning::git diff failed; running the full pipeline."
            emit false
          fi

          # The allowlist/denylist and the fail-closed guards live in
          # tools/ci/, not inline here, so they can be unit-tested. The test
          # runs in the unconditional `verify` job below.
          verdict="$(tools/ci/classify-changed-paths.sh "$changed")"

          case "$verdict" in
            docs_only=true) emit true ;;
            docs_only=false) emit false ;;
            *)
              echo "::warning::Unexpected classifier output '${verdict}'; running the full pipeline."
              emit false
              ;;
          esac

  verify:
    name: Lint + Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # Deliberately in this job and not in `integration-run`: `verify` is
      # unconditional, so the test covering the docs-only filter can never be
      # skipped by the filter it tests. Pure bash, so it runs before any install
      # and still reports if the install step later flakes.
      - name: Test the CI path classifier
        run: tools/ci/classify-path.test.sh

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile || {
            echo "::warning::bun install failed (likely isolated-vm postinstall flake); retrying with fresh cache"
            rm -rf ~/.bun/install/cache
            bun install --frozen-lockfile
          }

      - name: Set up turbo remote cache (GHA-backed)
        uses: rharkor/caching-for-turbo@v2.3.12

      - name: Lint core packages
        run: npm run lint-core

      - name: Lint qadams
        run: npm run lint-qadams

      - name: Unit tests
        run: npm run test-unit

  # The heavy suite. NOT a required status check — the `integration` gate job
  # below carries the required "CE Integration Tests" context and always reports.
  integration-run:
    name: CE integration suite
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg14
        env:
          POSTGRES_DB: qadam_flow_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.0.7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile || {
            echo "::warning::bun install failed (likely isolated-vm postinstall flake); retrying with fresh cache"
            rm -rf ~/.bun/install/cache
            bun install --frozen-lockfile
          }

      - name: Set up turbo remote cache (GHA-backed)
        uses: rharkor/caching-for-turbo@v2.3.12

      # The flow-run e2e tests fork the engine from dist/packages/engine/main.js;
      # it is not a build dependency of the api package, so build it explicitly.
      - name: Build engine (e2e prerequisite)
        run: npx turbo run build --filter=@aiqadam/engine

      # #59 is resolved — check-migrations no longer false-positives on a clean
      # baseline, so run the full test-api gate (check-migrations + test-ce),
      # matching the root `test-api` script.
      #
      # Note this step is CONDITIONAL: it lives in `integration-run`, which the
      # `changes` job skips on a provably docs-only diff, so docs-only PRs run
      # neither test-ce nor the migration-drift check. That is safe because
      # entities and migrations all live under `packages/`, which the classifier's
      # blanket `packages|packages/*` arm always calls code — so a diff capable of
      # introducing drift can never be classified docs-only. Do not "fix" this by
      # moving check-migrations into `verify`: it runs migrations against a live
      # database and turbo gives it `dependsOn: ["build"]`, so making it
      # unconditional means putting a postgres service and a 1-2 min DB spin-up
      # back onto every docs PR.
      - name: Run CE integration tests
        run: npx turbo run check-migrations test-ce --filter=api --concurrency=1

  # Required status check. Runs unconditionally so it always reports a conclusion
  # — a *skipped* required check never reports one under GitHub rulesets, which
  # would leave the PR permanently unmergeable. It passes only if the heavy suite
  # succeeded, or if it was skipped *and* the classifier proved the diff is
  # docs-only. Any other combination (classifier failure, suite failure, or a
  # skip we cannot justify) fails the required context.
  integration:
    name: CE Integration Tests
    needs: [changes, integration-run]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve CE integration status
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          RUN_RESULT: ${{ needs.integration-run.result }}
        run: |
          set -uo pipefail
          echo "classifier=${CHANGES_RESULT} docs_only=${DOCS_ONLY:-<unset>} suite=${RUN_RESULT}"

          if [ "$CHANGES_RESULT" != success ]; then
            echo "::error::Path classifier did not succeed (${CHANGES_RESULT}); refusing to pass the required check."
            exit 1
          fi

          case "$RUN_RESULT" in
            success)
              echo "CE integration suite passed. ✅"
              ;;
            skipped)
              if [ "${DOCS_ONLY:-}" != true ]; then
                echo "::error::CE integration suite was skipped but the diff is not provably docs-only."
                exit 1
              fi
              echo "Diff is provably docs-only; CE integration suite intentionally not run. ✅"
              ;;
            *)
              echo "::error::CE integration suite result: ${RUN_RESULT}."
              exit 1
              ;;
          esac

  dco:
    name: DCO Sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify every commit is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          commits=$(git rev-list --no-merges "$BASE_SHA".."$HEAD_SHA")
          if [ -z "$commits" ]; then
            echo "No non-merge commits to check."
            exit 0
          fi
          fail=0
          for sha in $commits; do
            author="$(git show -s --format='%an <%ae>' "$sha")"
            signoffs="$(git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$sha")"
            if ! printf '%s\n' "$signoffs" | grep -qiF "$author"; then
              echo "::error::Commit ${sha} is missing a 'Signed-off-by' trailer matching its author (${author})."
              echo "  found sign-off: ${signoffs:-<none>}"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "DCO check failed. Every commit must carry 'Signed-off-by: Name <email>' matching its author (see CONTRIBUTING.md)."
            echo "Sign new commits with 'git commit -s'; fix existing ones with 'git rebase --signoff ${BASE_SHA}' then force-push."
            exit 1
          fi
          echo "All commits are signed off. ✅"

  # Kept on PRs: it is the only pre-merge guard against a Dockerfile / build-graph
  # break, and on `push: main` it publishes ghcr.io/aiqadam/qadam-flow:main — so a
  # break found after merge is already a broken published image. Gated by the same
  # deny-by-default classifier: a docs-only diff cannot change the image.
  image:
    name: Docker Image
    needs: [changes, verify]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
          buildkitd-flags: --allow-insecure-entitlement network.host

      - name: Set up turbo remote cache (GHA-backed)
        uses: rharkor/caching-for-turbo@v2.3.12

      - name: Force TURBO_API to IPv4 loopback (moby/buildkit#5813)
        run: echo "TURBO_API=${TURBO_API//localhost/127.0.0.1}" >> "$GITHUB_ENV"

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/aiqadam/qadam-flow
          tags: |
            type=ref,event=branch
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title=Qadam Flow
            org.opencontainers.image.description=Open-source AI-first workflow automation platform
            org.opencontainers.image.source=https://github.com/aiqadam/qadam-flow

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Scope must stay in sync with release.yml's matrix.cacheScope so a
          # tag build reuses the layers main just produced for the same arch.
          cache-from: type=gha,scope=monolith-linux-amd64
          cache-to: type=gha,mode=max,scope=monolith-linux-amd64
          allow: |
            network.host
          build-args: |
            TURBO_API=${{ env.TURBO_API }}
            TURBO_TOKEN=${{ env.TURBO_TOKEN }}
            TURBO_TEAM=${{ env.TURBO_TEAM }}
