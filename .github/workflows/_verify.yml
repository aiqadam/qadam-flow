name: Verify

# Reusable lint + typecheck + unit-test gate. Called by ci.yml (every PR and push
# to main), by release.yml (tag builds) and by publish-packages.yml (a dispatched
# npm publish), so those cannot drift apart. The first two already had: before this
# extraction both carried a copy of this job and only ci.yml's copy ran the two
# pure-shell tests below.
#
# Note for readers of the two non-PR callers: the steps below carrying
# `if: github.event_name == 'pull_request'` are skipped for them, so "verify ran"
# is not the same statement there as it is on a PR.
#
# Callers must wrap this in a gate job — see the comment on `verify` in ci.yml for
# why. A reusable workflow's check reports as "<caller job> / <inner job>", which
# is not the required context name.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  # Named for the work, not for the required context: the caller's gate job
  # carries "Lint + Unit Tests". This mirrors the existing
  # "CE integration suite" (work) / "CE Integration Tests" (required gate)
  # split in ci.yml, so the two checks on a PR read as suite-and-verdict rather
  # than as two identically named checks.
  verify:
    name: Lint + unit test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # fetch-depth: 0 is load-bearing for the "Check new migration metadata"
      # step below (#445): it diffs PR_BASE_SHA...PR_HEAD_SHA, both of which
      # must be reachable locally, and a depth-1 checkout would only have HEAD.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # These run before any install, deliberately: they are pure shell, so they
      # still report if the install step later flakes. This workflow is only ever
      # called from an unconditional job, so the test covering the docs-only path
      # filter can never be skipped by the filter it tests.
      - name: Test the CI path classifier
        run: tools/ci/classify-path.test.sh

      # run.sh is the `curl … | sh` install path and has no other automated
      # coverage. Extracting this job means tag builds now run it too, which they
      # previously did not.
      - name: Test run.sh env reconciliation
        run: tools/ci/test-run-sh.sh

      # docker-entrypoint.sh is the other pure-shell entry point with no image
      # build behind it. #51 was a supervision regression nothing would have
      # caught; this suite runs against a stub `node` in seconds.
      - name: Test docker-entrypoint.sh
        run: tools/ci/test-entrypoint.sh

      # The release gate that refuses to ship an undocumented breaking change
      # (release.yml's `breaking-change-gate`). It only ever runs for real on a
      # tag push, which is far too rare a feedback loop to find a regression in,
      # so its behaviour is pinned here on every PR — against cases it must
      # REJECT as much as cases it must accept, plus the UNKNOWN cases where it
      # must fail rather than report an empty range as clean.
      - name: Test the release breaking-change gate
        run: tools/ci/test-breaking-change-gate.sh

      # The other half of the release pipeline that only ever runs for real on a tag: the step
      # that holds the npm publish token (#486). Its reject cases are the point — publishing in
      # the wrong ORDER, or publishing a tarball the pack job never declared, both look green,
      # and `npm publish` is the one action in this repo with no undo. Pure shell against a stub
      # `npm`, so it belongs up here with the other dependency-free suites.
      - name: Test the packed-tarball publisher
        run: tools/ci/test-publish-packed-tarballs.sh

      # install-deps.sh is a recursive delete that every install in CI runs, and
      # the only thing keeping it off a tracked git fixture is a depth bound
      # that has to stay equal to the cache `path:` globs below and in ci.yml.
      # This suite asserts that agreement, so the drift cannot be silent. Pure
      # shell, so it belongs up here with the others — before any install.
      - name: Test the CI dependency-install helper
        timeout-minutes: 2
        run: tools/ci/install-deps.test.sh

      # The readiness gate ci.yml's `e2e` job puts in front of the Playwright
      # suite. It only ever runs for real inside that job, where a wrong answer
      # in the passing direction turns "the stack never booted" into eight
      # spec timeouts read as UI regressions. Pinned here because that is the
      # failure mode nothing downstream can distinguish.
      - name: Test the CI readiness gate
        timeout-minutes: 2
        run: tools/ci/wait-for-api.test.sh

      # The gate that stops a skipped @smtp mail spec (#342) or chat spec (#337) from passing its
      # e2e job phase report unnoticed — Playwright itself exits 0 either way, so this script's
      # own correctness is the acceptance criterion. Pure Node against synthetic fixtures, so it
      # belongs up here with the others.
      - name: Test the skipped-spec assertion gate
        timeout-minutes: 2
        run: tools/ci/assert-no-skipped-specs.test.sh

      - uses: actions/setup-node@v6
        id: node
        with:
          node-version: 24

      # The other release gate (release.yml's `version-tag-gate`): the tag being
      # published must agree with the version `apVersionUtil.getCurrentRelease()`
      # reads out of the root package.json at runtime. Same rationale as the
      # breaking-change suite above — it only runs for real on a tag push, so its
      # reject cases are pinned here on every PR. It sits below setup-node rather
      # than with the pure-shell suites because the gate parses package.json with
      # node instead of hand-rolling a JSON regex.
      - name: Test the release version/tag gate
        timeout-minutes: 2
        run: tools/ci/test-version-tag-gate.sh

      # The agent-docs wiring gate: a skill or charter that is registered nowhere, or carries a
      # description no harness can trigger on, is one no agent is ever told to use — which is
      # how seven of fourteen skills came to be routed to from nowhere outside their own dir.
      # Node-only and dependency-free, so it sits above the install and still reports on a
      # docs-only PR.
      - name: Test the agent-docs wiring gate
        timeout-minutes: 2
        run: tools/ci/test-agent-docs-check.sh

      - name: Check agent docs wiring
        timeout-minutes: 2
        run: npm run check-agent-docs

      # The advisory review dispatcher (#444) is a node script, so it sits below
      # setup-node rather than with the pure-shell suites above. It pins the
      # behaviour matrix of `npm run review` and the hook's [r]eview branch
      # against stub ocr/agent CLIs: a review that cannot run must skip, never
      # block, and only a confirmed `critical` finding may stop a push.
      - name: Test the review dispatcher
        timeout-minutes: 3
        run: tools/ci/test-review.sh

      - uses: oven-sh/setup-bun@v2
        id: bun
        with:
          bun-version: 1.3.3

      # Restores the BUILT dependency tree — node_modules including every
      # compiled `.node` addon — not bun's download cache. Caching the download
      # cache was tried, measured on real runners and closed unmerged (#157,
      # then again in #191): it hits, and install time does not move, because
      # what the ~230 s buys is producing node_modules, not fetching tarballs.
      # #155 has the phase split.
      #
      # `restore`/`save` rather than `actions/cache`, for two reasons: the save
      # below sits immediately after install, so a later lint failure does not
      # throw away a tree that installed cleanly; and only this job saves — see
      # the note on the restore step in ci.yml's `integration-run`.
      #
      # The path globs stop at three levels under packages/, the deepest
      # workspace glob in package.json (`packages/qadams/community/*`), and
      # deliberately do NOT match `**/node_modules`:
      # packages/server/engine/test/resources/.../hello_world_npm/node_modules
      # is a *tracked* fixture, and a cache that both captured and restored it
      # could silently revert an edit to it.
      #
      # These globs must agree with `INSTALL_NODE_MODULES_MAXDEPTH` in
      # tools/ci/install-deps.sh, which deletes the same set on a retry.
      # tools/ci/install-deps.test.sh asserts that, so editing one side without
      # the other fails the build rather than quietly widening a recursive rm.
      - name: Restore built node_modules
        id: node-modules
        # Skipped when a PR carries `refresh-cache`, forcing that one PR through a real install
        # without disturbing the cache any other branch uses. Exists because a PR that changes
        # install behaviour but no hashed manifest gets a cache hit, so its own run cannot
        # exercise the change it makes — which is how a broken install shipped unnoticed.
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'refresh-cache') }}
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/*/node_modules
            packages/*/*/*/node_modules
          # Every input that can change the CONTENT of the tree, and no prefix
          # `restore-keys` fallback. Component by component:
          #   epoch           `vars.NODE_MODULES_CACHE_EPOCH`, default `v1`.
          #                   actions/cache never re-saves on a hit, so a
          #                   poisoned entry would be served forever. Bumping
          #                   the repo variable invalidates every entry with no
          #                   commit; it is the bluntest of the three escapes —
          #                   see AGENTS.md "Controlling the node_modules cache"
          #                   for `gh cache delete` and the `refresh-cache`
          #                   label, which are both narrower.
          #   runner.os/arch  the tree contains native binaries. The shipped
          #                   files are named per platform and libc
          #                   (`isolated-vm.abi137.glibc.node`, `...musl.node`).
          #   node version    the RESOLVED version, not the `24` spec: those
          #                   same filenames are keyed by Node's ABI, and
          #                   anything falling back to `node-gyp rebuild`
          #                   compiles against this Node's headers. Stricter
          #                   than ABI alone on purpose — the cost of a Node
          #                   patch bump is one cold run.
          #   bun version     bun decides the tree's SHAPE. bunfig.toml sets
          #                   `linker = "isolated"`, so the layout is
          #                   node_modules/.bun/<pkg>@<ver>/... plus a symlink
          #                   farm; a bun bump can change that wholesale.
          #   hashFiles       bun.lock (resolved versions), bunfig.toml (linker
          #                   and minimumReleaseAge), package.json (workspace
          #                   globs and the `rollup -> @rollup/wasm-node`
          #                   resolution), .npmrc (scoped registry,
          #                   legacy-peer-deps, save-exact — editing it can
          #                   change what gets installed without touching any
          #                   of the other three), and tools/ci/install-deps.sh
          #                   itself, which sets the environment the install runs
          #                   under. Hashing the script is deliberately
          #                   conservative: editing its comments costs a needless
          #                   cold install, and in exchange install behaviour can
          #                   never change without the key changing. The
          #                   alternative — a separate env file, parsed by hand so
          #                   prose edits stayed cheap — was tried and reverted
          #                   after three fail-open parser defects. All five are
          #                   tracked files outside node_modules, so the hash
          #                   cannot accidentally glob into it and differ between
          #                   restore and save. install-deps.test.sh asserts all
          #                   five are here.
          #
          # No `restore-keys`: a prefix match is safe for a download cache,
          # where bun re-resolves everything anyway, and unsafe here. A partial
          # hit would put a `.node` built for a different Node ABI on disk at
          # the version bun expects, so bun would consider that package
          # installed and skip its build — leaving a binary that fails at
          # `require()` time, not at install time. Exact match only means every
          # ABI-determining input is identical by construction.
          key: node-modules-${{ vars.NODE_MODULES_CACHE_EPOCH || 'v1' }}-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-bun${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock', 'bunfig.toml', 'package.json', '.npmrc', 'tools/ci/install-deps.sh') }}

      # A cache hit and a cold install are not the same run, and until now the difference existed
      # only as prose in the log. bun does not re-run install scripts for a package it already sees
      # at the right version, so on a hit the install path is not exercised at all — which is how a
      # broken postinstall stayed invisible until a PR happened to touch bun.lock, and why a green
      # check on a cache hit is not evidence that an install-related change works.
      #
      # Emitted three ways; see the step body for which of them is actually readable from outside
      # this job, because they are not equivalent. `gh api .../jobs` exposes step conclusions but
      # not this distinction, which is the whole reason the step exists.
      - name: Report node_modules cache state
        id: cache-state
        run: |
          if [ "${{ steps.node-modules.outputs.cache-hit }}" = "true" ]; then
            state="cache-hit"
            note="node_modules restored from cache. bun skipped install scripts, so this run does NOT exercise the install path."
          else
            state="cold"
            note="node_modules built by a real install. Install scripts ran, so this run does exercise the install path."
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
          # The step output alone is not readable from outside the job — this workflow is a
          # `workflow_call` target and declares no `outputs:`, and the Actions API exposes step
          # conclusions but not step outputs. `::notice::` surfaces via the check-run annotations
          # endpoint, which is what actually makes the state readable without downloading the log.
          echo "::notice title=node_modules cache::state=$state"
          echo "node_modules: **$state** — $note" >> "$GITHUB_STEP_SUMMARY"
          echo "node_modules cache state: $state"

      # Runs `bun install --frozen-lockfile` on hit and on miss alike. Note what
      # that does and does not check: it asserts resolution needs no lockfile
      # change, NOT that the restored files are intact — bun skips re-extracting
      # a package it sees present at the right version. The exact-match key and
      # the addon probe below are what carry that; see the script's header.
      - name: Install dependencies
        run: tools/ci/install-deps.sh

      # The restored tree is only worth having if its addons work, and neither
      # suite would notice if they did not — the api vitest config aliases
      # isolated-vm to a mock. This is also the only step that can catch a
      # restore that is corrupt at the expected version. See the script's header.
      - name: Verify native addons load
        run: tools/ci/verify-native-modules.sh

      # Immediately after a verified install, not at job end: this tree is a
      # pure function of the key, so nothing later in the job can improve it,
      # and a lint failure should not cost the next run its cache.
      #
      # The `if:` carries an implicit `success()`, so a failed addon probe also
      # means nothing is saved. That coupling is the intended order: a cold run
      # must establish that what it publishes is good, or one bad build gets
      # served to every later job.
      - name: Save built node_modules
        # The label is repeated here deliberately. With restore skipped, `cache-hit` is empty so this
        # step's own condition passes — but `cache-primary-key` is empty too, so the save would fail
        # key validation rather than write anything. Skipping it is the correct outcome either way:
        # a run that deliberately bypassed the cache has not earned the right to publish to it.
        if: ${{ steps.node-modules.outputs.cache-hit != 'true' && !contains(github.event.pull_request.labels.*.name, 'refresh-cache') }}
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/*/node_modules
            packages/*/*/*/node_modules
          # The key restore COMPUTED, not a re-evaluation of the expression.
          # Re-writing it here would be a second chance to drift.
          key: ${{ steps.node-modules.outputs.cache-primary-key }}

      - name: Set up turbo remote cache (GHA-backed)
        uses: rharkor/caching-for-turbo@v2.3.12

      # Needs the installed workspace (the ICU parser lives in node_modules), so
      # it cannot join the dependency-free tools/ci tests above. Placed before
      # the heavies so a translation drift costs a second, not the whole suite.
      - name: Test the i18n checker
        run: tools/ci/test-i18n-check.sh

      - name: Check i18n catalogs
        run: npm run check-i18n

      # #427: a StaticDropdown/StaticMultiSelectDropdown property whose own defaultValue is
      # absent from its own declared options. Static AST scan, not a runtime import of built
      # qadams — see the checker's header comment for why that distinction matters here.
      - name: Test the dropdown-defaults checker
        run: tools/ci/test-dropdown-defaults-check.sh

      - name: Check StaticDropdown defaultValue against declared options
        run: npm run check-dropdown-defaults

      # Reject-case fixtures for the migration metadata gate below (#445). Needs
      # ts-node/semver from node_modules, so it sits down here rather than with
      # the pure-shell suite above.
      - name: Test the migration metadata gate
        run: tools/ci/test-check-migration-rollback.sh

      # tools/scripts/check-migration-rollback.ts existed but was never wired
      # into any job (#445): a migration missing `breaking`, `release`, or
      # `down()` compiled and merged with nothing red. It reads
      # PR_BASE_SHA...PR_HEAD_SHA rather than a branch ref for the same reason
      # ci.yml's `changes`/e2e jobs diff fixed SHAs — a branch ref can move
      # between checkout and this step running. Skipped outside pull_request:
      # there is no PR diff to check on a push-to-main or tag build, matching
      # why the breaking-change/version-tag release gates live in release.yml
      # and not here.
      - name: Check new migration metadata
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run check-migration-metadata

      # #479: a required prop with no `defaultValue` added to an already-shipped action/trigger
      # invalidates every flow authored before the prop existed. Same PR_BASE_SHA/PR_HEAD_SHA
      # shape as the migration-metadata gate immediately above, for the same reason — see the
      # checker's own header comment for why this has to be a diff, not a check-dropdown-defaults-
      # style full-tree scan, and for what it still cannot see.
      - name: Test the required-prop-defaults checker
        run: tools/ci/test-required-prop-defaults-check.sh

      - name: Check newly-required qadam props carry a default or a major bump
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run check-required-prop-defaults

      # _publish-framework-packages.yml's `pack-framework-packages` job trusts a custom
      # workspace:* rewrite instead of bun's own (see that job's header for why). Needs
      # ts-node and the transform's own runtime deps (axios, via package-pre-publish-checks.ts) from
      # node_modules, so it sits down here with the other post-install tooling suites
      # rather than with the pure-shell suite above.
      - name: Test the publish-time workspace:* rewrite invariants
        run: tools/ci/test-publish-workspace-invariants.sh

      # Unfiltered, deliberately. The enumerated `lint-core` / `lint-qadams`
      # scripts silently missed every package they did not name — `@aiqadam/cli`,
      # `tests-e2e`, and, because the glob was `qadam-*` while the packages are
      # `qadams-*`, `@aiqadam/qadams-framework` and `@aiqadam/qadams-common`
      # (#184, same family as #148 and #164). An unfiltered run cannot miss a
      # package, so a new one is linted the day it declares the script.
      - name: Lint all packages
        run: npm run lint-all

      # All eight TypeScript packages declare a `typecheck` script as of #245.
      # Before that only `packages/web` did, so this step ran unfiltered and still
      # checked one package of eight — turbo reports success for a package that
      # does not declare the script (the #148 class), which is what made a green
      # run here mean so much less than it looked. Unfiltered for the same reason
      # as lint above: a filter list is the defect, not the fix. The ~230 qadam
      # packages deliberately declare none — their `build` is `tsc -p
      # tsconfig.lib.json`, so a compiler already checks their `src` (their tests
      # are excluded from that tsconfig and remain unchecked).
      - name: Typecheck
        run: npm run typecheck

      # `npm run test-unit` is one unfiltered `turbo run test`, for the same reason
      # as lint and typecheck above. It used to be two filtered invocations, and
      # the filter list omitted `packages/server/worker` (18 files, 215 tests) and
      # all 14 core qadams that declare a `test` script (40 files, 231 tests) —
      # #215, the same family as #148 / #164 / #184. Do not reintroduce a filter
      # list here or in the root script; a package must be covered the day it
      # declares the script.
      - name: Unit tests
        run: npm run test-unit
